name: Build HarmonyOS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build HarmonyOS APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Create output directory
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/debug/*.apk build/
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harmony-apk
          path: build/app-debug.apk

      - name: Upload to Releases
        run: |
          gh release create harmony-build-v1 --repo 5411636/enterprise-office-app --title "HarmonyOS Build v1" build/app-debug.apk || true