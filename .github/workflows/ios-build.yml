name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify EAS authentication
        run: |
          export EXPO_TOKEN=${{ secrets.EAS_TOKEN }}
          eas whoami || true

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
        run: |
          export EXPO_TOKEN=${{ secrets.EAS_TOKEN }}
          export FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          export FASTLANE_USER=${{ secrets.APPLE_ID }}
          eas build --platform ios --profile preview --wait

      - name: Download IPA
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          export EXPO_TOKEN=${{ secrets.EAS_TOKEN }}
          BUILD_ID=$(eas build:list --platform ios --latest --json | jq -r '.[0].id')
          eas build:download --id $BUILD_ID --platform ios

      - name: Upload to Releases
        run: |
          gh release create ios-build-v1 --repo 5411636/enterprise-office-app --title "iOS Build v1" build/*.ipa || true